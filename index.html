<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 2D Platformer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Скрыть прокрутку */
            background-color: #2c3e50; /* Цвет фона страницы */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameCanvas {
            border: 4px solid #34495e;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #34495e; /* Цвет фона игры */
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ecf0f1;
            font-size: 24px;
            pointer-events: none; /* UI не мешает кликам */
        }
    </style>
</head>
<body>

    <div id="ui">Счет: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // --- Настройка Canvas ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // --- Игровые Константы ---
        const GRAVITY = 0.8;
        const PLAYER_SPEED = 5;
        const JUMP_FORCE = 15;

        // --- Классы Объектов ---

        class Player {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.velocityX = 0;
                this.velocityY = 0;
                this.onGround = false;
                this.color = '#e74c3c'; // Красный игрок
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                // Применение гравитации
                this.velocityY += GRAVITY;

                // Движение и применение скоростей
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Простая коллизия с границами канваса (пол)
                if (this.y + this.height > canvas.height) {
                    this.y = canvas.height - this.height;
                    this.velocityY = 0;
                    this.onGround = true;
                } else {
                    this.onGround = false;
                }

                // Ограничение движения по горизонтали
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
            }
        }

        class Platform {
            constructor(x, y, width, height, color) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color || '#95a5a6'; // Серые платформы по умолчанию
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.color = '#f1c40f'; // Золотая монетка
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x + this.radius, this.y + this.radius, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        class Spike {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = '#2c3e50'; // Темные шипы
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.fill();
                ctx.closePath();
            }
        }

        // --- Управление Кнопками ---
        const keys = {
            right: false,
            left: false,
            up: false
        };

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
        });

        // --- Игровые Переменные и Объекты ---
        let player;
        let platforms = [];
        let coins = [];
        let spikes = [];
        let score = 0;

        function initGame() {
            // Создание игрока
            player = new Player(50, canvas.height - 150, 30, 50);

            // Создание уровней
            platforms = [
                new Platform(0, canvas.height - 20, canvas.width, 20), // Пол
                new Platform(100, canvas.height - 100, 200, 20),
                new Platform(400, canvas.height - 200, 200, 20),
                new Platform(150, canvas.height - 300, 150, 20),
                new Platform(500, canvas.height - 350, 250, 20),
                new Platform(canvas.width - 100, canvas.height - 450, 100, 20)
            ];

            coins = [
                new Coin(200, canvas.height - 150),
                new Coin(500, canvas.height - 250),
                new Coin(200, canvas.height - 350),
                new Coin(600, canvas.height - 400)
            ];

            spikes = [
                new Spike(300, canvas.height - 50, 40, 30),
                new Spike(550, canvas.height - 50, 40, 30)
            ];

            score = 0;
            scoreElement.innerText = score;
        }

        // --- Вспомогательная Функция Коллизий ---
        function rectIntersect(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // --- Основной Игровой Цикл ---
        function gameLoop() {
            // Очистка канваса
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Обработка ввода
            player.velocityX = 0;
            if (keys.right) player.velocityX = PLAYER_SPEED;
            if (keys.left) player.velocityX = -PLAYER_SPEED;
            if (keys.up && player.onGround) {
                player.velocityY = -JUMP_FORCE;
                player.onGround = false;
            }

            // Обновление физики игрока
            player.update();

            // Обработка коллизий с платформами
            player.onGround = false; // Сброс, если коллизий нет
            platforms.forEach(platform => {
                platform.draw();
                if (rectIntersect(player, platform)) {
                    // Коллизия снизу (приземление)
                    if (player.velocityY > 0 && player.y + player.height - player.velocityY <= platform.y) {
                        player.y = platform.y - player.height;
                        player.velocityY = 0;
                        player.onGround = true;
                    }
                    // Коллизия сверху
                    else if (player.velocityY < 0 && player.y - player.velocityY >= platform.y + platform.height) {
                        player.y = platform.y + platform.height;
                        player.velocityY = 0;
                    }
                    // Коллизии по бокам
                    else if (player.velocityX > 0) {
                        player.x = platform.x - player.width;
                    }
                    else if (player.velocityX < 0) {
                        player.x = platform.x + platform.width;
                    }
                }
            });

            // Обработка сбора монеток
            coins = coins.filter(coin => {
                coin.draw();
                if (rectIntersect(player, { x: coin.x, y: coin.y, width: coin.radius * 2, height: coin.radius * 2 })) {
                    score += 10;
                    scoreElement.innerText = score;
                    return false; // Удалить монетку
                }
                return true;
            });

            // Обработка столкновения с шипами
            spikes.forEach(spike => {
                spike.draw();
                if (rectIntersect(player, spike)) {
                    alert('АЙ!!!! Начать заново.');
                    initGame();
                }
            });

            // Отрисовка игрока
            player.draw();

            // Повторение цикла
            requestAnimationFrame(gameLoop);
        }

        // --- Запуск Игры ---
        initGame();
        gameLoop();

    </script>
</body>
</html>
