<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Артём Игра</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #gameContainer {
            position: relative;
        }

        #gameCanvas {
            border: 4px solid #0f3460;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            background-color: #16213e;
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            display: flex;
            gap: 30px;
            text-shadow: 2px 2px 0px #000;
        }

        /* Экран меню */
        #menuScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 600px;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 10;
        }

        #menuTitle {
            font-size: 40px;
            margin-bottom: 20px;
            color: #e94560;
            text-shadow: 2px 2px 0px #000;
        }

        #menuSubtitle {
            font-size: 18px;
            margin-bottom: 30px;
            color: #b2bec3;
            max-width: 550px;
            line-height: 1.5;
        }

        .btn {
            padding: 15px 35px;
            font-size: 22px;
            font-weight: bold;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 #900c3f;
        }

        .btn:hover { background-color: #ff6b81; }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #900c3f; }

        /* Кнопки-стрелки управления на экране */
        #controls {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-top: 15px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background-color: #0f3460;
            color: white;
            font-size: 30px;
            font-weight: bold;
            border: 3px solid #e94560;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 0 #091d36;
        }

        .touch-btn:active {
            background-color: #e94560;
            transform: translateY(3px);
            box-shadow: 0 1px 0 #091d36;
        }

        .jump-btn {
            width: 140px;
            background-color: #e94560;
            border-color: #ff6b81;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Время: <span id="timer">144</span> сек</div>
            <div>Монеты: <span id="score">0</span></div>
            <div>Рост: <span id="growthLevel">1</span>x</div>
        </div>

        <div id="menuScreen">
            <div id="menuTitle">РАСТИ И ПОБЕЖДАЙ!</div>
            <div id="menuSubtitle">
                Собирай монеты, чтобы становиться БОЛЬШИМ!<br>
                Шипы и враги уменьшают ваш размер. Если наступить маленьким — поражение!<br>
                Успей дойти до ФИНИША!
            </div>
            <button class="btn" id="actionBtn" onclick="startGame()">НАЧАТЬ ИГРУ</button>
        </div>
    </div>

    <!-- Стрелки управления под экраном -->
    <div id="controls">
        <div class="btn-group">
            <div class="touch-btn" id="btnLeft">◄</div>
            <div class="touch-btn" id="btnRight">►</div>
        </div>
        <div class="btn-group">
            <div class="touch-btn jump-btn" id="btnJump">ПРЫЖОК ▲</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerElement = document.getElementById('timer');
        const scoreElement = document.getElementById('score');
        const growthElement = document.getElementById('growthLevel');
        const menuScreen = document.getElementById('menuScreen');
        const menuTitle = document.getElementById('menuTitle');
        const menuSubtitle = document.getElementById('menuSubtitle');
        const actionBtn = document.getElementById('actionBtn');

        const GRAVITY = 0.75;
        const PLAYER_SPEED = 5.5;
        const JUMP_FORCE = 14.5;
        const LEVEL_WIDTH = 4500;

        let cameraX = 0;
        let timeLeft = 144;
        let score = 0;
        let growth = 1;
        let gameActive = false;
        let timerInterval = null;
        let invulnerableTimer = 0;

        let BASE_WIDTH = 30;
        let BASE_HEIGHT = 42;

        let player = {
            x: 100,
            y: 400,
            width: BASE_WIDTH,
            height: BASE_HEIGHT,
            vx: 0,
            vy: 0,
            onGround: false
        };

        let platforms = [];
        let spikes = [];
        let enemies = [];
        let coins = [];
        let finishLine = { x: 4200, y: 300, width: 50, height: 250 };

        function updatePlayerSize() {
            let oldHeight = player.height;
            if (growth === 1) {
                player.width = BASE_WIDTH;
                player.height = BASE_HEIGHT;
            } else if (growth === 2) {
                player.width = BASE_WIDTH * 1.4;
                player.height = BASE_HEIGHT * 1.4;
            } else if (growth >= 3) {
                player.width = BASE_WIDTH * 1.8;
                player.height = BASE_HEIGHT * 1.8;
            }
            if (player.onGround) {
                player.y -= (player.height - oldHeight);
            }
            growthElement.innerText = growth;
        }

        function initLevel() {
            growth = 1;
            updatePlayerSize();
            player.x = 100;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            cameraX = 0;
            timeLeft = 144;
            score = 0;
            invulnerableTimer = 0;
            scoreElement.innerText = score;
            timerElement.innerText = timeLeft;

            platforms = [
                { x: 0, y: 520, width: 800, height: 80 },
                { x: 900, y: 450, width: 250, height: 30 },
                { x: 1220, y: 380, width: 200, height: 30 },
                { x: 1480, y: 310, width: 200, height: 30 },
                { x: 1750, y: 460, width: 450, height: 30 },
                { x: 2280, y: 390, width: 250, height: 30 },
                { x: 2600, y: 320, width: 300, height: 30 },
                { x: 2980, y: 440, width: 400, height: 30 },
                { x: 3450, y: 370, width: 250, height: 30 },
                { x: 3780, y: 480, width: 700, height: 120 }
            ];

            spikes = [
                { x: 500, y: 490, width: 50, height: 30 },
                { x: 1000, y: 420, width: 40, height: 30 },
                { x: 1850, y: 430, width: 40, height: 30 },
                { x: 2700, y: 290, width: 50, height: 30 },
                { x: 3100, y: 410, width: 50, height: 30 },
                { x: 3950, y: 450, width: 60, height: 30 }
            ];

            enemies = [
                { x: 400, y: 480, width: 35, height: 40, minX: 300, maxX: 650, speed: 2 },
                { x: 1800, y: 420, width: 35, height: 40, minX: 1760, maxX: 2100, speed: 2.5 },
                { x: 3020, y: 400, width: 35, height: 40, minX: 3000, maxX: 3300, speed: 3 }
            ];

            coins = [];
            for (let i = 0; i < 40; i++) {
                coins.push({
                    x: 250 + i * 100 + Math.sin(i) * 30,
                    y: 250 + (i % 4) * 50,
                    radius: 10,
                    collected: false
                });
            }
        }

        // Управление (Клавиатура + Накрашенные Кнопки)
        const keys = { right: false, left: false, up: false };

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
        });

        // Настройка кнопок на экране
        const bindTouch = (id, keyName) => {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); keys[keyName] = true; };
            const end = (e) => { e.preventDefault(); keys[keyName] = false; };
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
        };

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'up');

        function startGame() {
            initLevel();
            menuScreen.style.display = 'none';
            gameActive = true;

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                timerElement.innerText = timeLeft;
                if (timeLeft <= 0) {
                    gameOver("Время вышло! Уровень нужно проходить за 144 секунды!");
                }
            }, 1000);
        }

        function hitHazard() {
            if (invulnerableTimer > 0) return;

            if (growth > 1) {
                growth--;
                updatePlayerSize();
                invulnerableTimer = 60;
            } else {
                gameOver("Вас убил враг, вы наступили на шип или вы упали.");
            }
        }

        function gameOver(message) {
            gameActive = false;
            clearInterval(timerInterval);
            menuTitle.innerText = "ПОРАЖЕНИЕ";
            menuSubtitle.innerText = message;
            actionBtn.innerText = "НАЧАТЬ ЗАНОВО";
            menuScreen.style.display = 'flex';
        }

        function gameWin() {
            gameActive = false;
            clearInterval(timerInterval);
            menuTitle.innerText = "ПОБЕДА!!!";
            menuSubtitle.innerText = `Вы успели пройти за ${144 - timeLeft} сек! Итоговый рост: ${growth}x. Собранные монеты: ${score}.`;
            actionBtn.innerText = "ИГРАТЬ ЕЩЕ РАЗ";
            menuScreen.style.display = 'flex';
        }

        function rectIntersect(r1, r2) {
            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        function update() {
            if (!gameActive) return;

            if (invulnerableTimer > 0) invulnerableTimer--;

            player.vx = 0;
            if (keys.right) player.vx = PLAYER_SPEED;
            if (keys.left) player.vx = -PLAYER_SPEED;

            if (keys.up && player.onGround) {
                player.vy = -JUMP_FORCE;
                player.onGround = false;
            }

            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;

            if (player.x < 0) player.x = 0;

            player.onGround = false;
            platforms.forEach(p => {
                if (rectIntersect(player, p)) {
                    if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.onGround = true;
                    } else if (player.vy < 0 && player.y - player.vy >= p.y + p.height) {
                        player.y = p.y + p.height;
                        player.vy = 0;
                    } else if (player.vx > 0) {
                        player.x = p.x - player.width;
                    } else if (player.vx < 0) {
                        player.x = p.x + p.width;
                    }
                }
            });

            if (player.y > canvas.height) {
                gameOver("Вы упали в пропасть!");
            }

            enemies.forEach(e => {
                e.x += e.speed;
                if (e.x > e.maxX || e.x < e.minX) e.speed *= -1;
                if (rectIntersect(player, e)) {
                    hitHazard();
                }
            });

            spikes.forEach(s => {
                if (rectIntersect(player, s)) {
                    hitHazard();
                }
            });

            coins.forEach(c => {
                if (!c.collected) {
                    let distX = (player.x + player.width/2) - c.x;
                    let distY = (player.y + player.height/2) - c.y;
                    let distance = Math.sqrt(distX * distX + distY * distY);
                    if (distance < c.radius + player.width/2) {
                        c.collected = true;
                        score += 100;
                        scoreElement.innerText = score;

                        if (score % 500 === 0 && growth < 3) {
                            growth++;
                            updatePlayerSize();
                        }
                    }
                }
            });

            if (rectIntersect(player, finishLine)) {
                gameWin();
            }

            cameraX = player.x - 250;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > LEVEL_WIDTH - canvas.width) cameraX = LEVEL_WIDTH - canvas.width;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Финиш
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(finishLine.x, finishLine.y, finishLine.width, finishLine.height);
            ctx.fillStyle = '#000';
            ctx.font = "bold 18px Arial";
            ctx.fillText("ФИНИШ", finishLine.x + 5, finishLine.y - 10);

            // Платформы
            platforms.forEach(p => {
                ctx.fillStyle = '#0f3460';
                ctx.fillRect(p.x, p.y, p.width, p.height);
            });

            // Шипы
            spikes.forEach(s => {
                ctx.fillStyle = '#e94560';
                ctx.beginPath();
                ctx.moveTo(s.x, s.y + s.height);
                ctx.lineTo(s.x + s.width / 2, s.y);
                ctx.lineTo(s.x + s.width, s.y + s.height);
                ctx.fill();
                ctx.closePath();
            });

            // Враги
            enemies.forEach(e => {
                ctx.fillStyle = '#e94560';
                ctx.fillRect(e.x, e.y, e.width, e.height);
            });

            // Монеты
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fill();
                    ctx.closePath();
                }
            });

            // Игрок
            if (invulnerableTimer % 10 < 5) {
                ctx.fillStyle = growth === 3 ? '#e94560' : (growth === 2 ? '#f1c40f' : '#4ecca3');
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
