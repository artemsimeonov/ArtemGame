<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АРТЁМ ИГРА — Расти и побеждай!</title>

    <!-- ===== НАЧАЛО БЛОКА ОБЛОЖКИ И ПРЕВЬЮ ===== -->
    <meta property="og:title" content="АРТЁМ ИГРА — Расти и побеждай!">
    <meta property="og:description" content="Игра, где нужно собирать монетки и расти большим. От компании Akerent. Пройди за 144 секунды!">
    <meta property="og:type" content="website">
    
    <!-- Ссылка на вашу картинку cabos.png (замените ВАШ-ЛОГИН и ИМЯ-РЕПОЗИТОРИЯ) -->
    <meta property="og:image" content="https://raw.githubusercontent.com/artemsimeonov/ArtemGame/main/CABOS.png">
    <!-- ===== КОНЕЦ БЛОКА ОБЛОЖКИ И ПРЕВЬЮ ===== -->

    <style>
        /* Здесь начинаются стили игры (body, #gameCanvas и т.д.) */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f1026;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        /* ... остальные стили ... */

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f1026;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #gameContainer {
            position: relative;
        }

        #gameCanvas {
            border: 4px solid #e94560;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.4);
            background-color: #16213e;
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            display: flex;
            gap: 20px;
            text-shadow: 2px 2px 4px #000;
        }

        /* Экран обложки / меню */
        #menuScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 600px;
            background: linear-gradient(135deg, rgba(15, 16, 38, 0.95), rgba(22, 33, 62, 0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 10;
            border: 4px solid #e94560;
            box-sizing: border-box;
        }

        #menuTitle {
            font-size: 52px;
            margin-bottom: 5px;
            color: #f1c40f;
            text-shadow: 0 0 15px #f1c40f, 4px 4px 0px #e94560, 6px 6px 0px #000;
            letter-spacing: 2px;
        }

        #companyName {
            font-size: 16px;
            color: #4ecca3;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px #000;
        }

        #menuSubtitle {
            font-size: 16px;
            margin-bottom: 30px;
            color: #dcdde1;
            max-width: 550px;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px dashed #e94560;
            font-family: Arial, sans-serif;
        }

        .btn {
            padding: 16px 45px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(to bottom, #e94560, #900c3f);
            color: white;
            border: 2px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 0 #5c0827, 0 10px 20px rgba(0,0,0,0.5);
            font-family: 'Arial Black', sans-serif;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #ff6b81, #e94560);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #5c0827;
        }

        /* Кнопки управления */
        #controls {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-top: 15px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background-color: #16213e;
            color: white;
            font-size: 28px;
            font-weight: bold;
            border: 3px solid #e94560;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 0 #0f1026;
        }

        .touch-btn:active {
            background-color: #e94560;
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0f1026;
        }

        .jump-btn {
            width: 150px;
            background-color: #e94560;
            border-color: #ff6b81;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Время: <span id="timer">144</span> сек</div>
            <div>Монеты: <span id="score">0</span></div>
            <div>Рост: <span id="growthLevel">1</span>x</div>
            <div>Баффы: <span id="buffStatus" style="color: #4ecca3;">Нет</span></div>
        </div>

        <div id="menuScreen">
            <div id="menuTitle">АРТЁМ ИГРА</div>
            <div id="companyName">ОТ КОМПАНИИ AKERENT</div>
            <div id="menuSubtitle">
                Собирай монеты, чтобы расти! Ищи ⚡ ускорение и 🛡️ щит (бессмертие на 10 сек).<br>
                Доберись до финиша и **запрыгни в трубу** за 144 секунды!
            </div>
            <button class="btn" id="actionBtn" onclick="startGame()">НАЧАТЬ ИГРУ</button>
        </div>
    </div>

    <div id="controls">
        <div class="btn-group">
            <div class="touch-btn" id="btnLeft">◄</div>
            <div class="touch-btn" id="btnRight">►</div>
        </div>
        <div class="btn-group">
            <div class="touch-btn jump-btn" id="btnJump">ПРЫЖОК ▲</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerElement = document.getElementById('timer');
        const scoreElement = document.getElementById('score');
        const growthElement = document.getElementById('growthLevel');
        const buffStatusElement = document.getElementById('buffStatus');
        const menuScreen = document.getElementById('menuScreen');
        const menuTitle = document.getElementById('menuTitle');
        const menuSubtitle = document.getElementById('menuSubtitle');
        const actionBtn = document.getElementById('actionBtn');

        const GRAVITY = 0.75;
        const NORMAL_SPEED = 5.5;
        const BOOSTED_SPEED = 9.5;
        const JUMP_FORCE = 14.5;
        const LEVEL_WIDTH = 5000;

        let cameraX = 0;
        let timeLeft = 144;
        let score = 0;
        let growth = 1;
        let gameActive = false;
        let timerInterval = null;
        
        let invulnerableTimer = 0;
        let speedBuffTimer = 0;

        let BASE_WIDTH = 30;
        let BASE_HEIGHT = 42;

        let player = {
            x: 100,
            y: 400,
            width: BASE_WIDTH,
            height: BASE_HEIGHT,
            vx: 0,
            vy: 0,
            onGround: false
        };

        let platforms = [];
        let spikes = [];
        let enemies = [];
        let coins = [];
        let powerUps = [];
        let finishPipe = { x: 4700, y: 320, width: 60, height: 200 };

        function updatePlayerSize() {
            let oldHeight = player.height;
            if (growth === 1) {
                player.width = BASE_WIDTH;
                player.height = BASE_HEIGHT;
            } else if (growth === 2) {
                player.width = BASE_WIDTH * 1.4;
                player.height = BASE_HEIGHT * 1.4;
            } else if (growth >= 3) {
                player.width = BASE_WIDTH * 1.8;
                player.height = BASE_HEIGHT * 1.8;
            }
            if (player.onGround) {
                player.y -= (player.height - oldHeight);
            }
            growthElement.innerText = growth;
        }

        function initLevel() {
            growth = 1;
            updatePlayerSize();
            player.x = 100;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            cameraX = 0;
            timeLeft = 144;
            score = 0;
            invulnerableTimer = 0;
            speedBuffTimer = 0;
            scoreElement.innerText = score;
            timerElement.innerText = timeLeft;
            buffStatusElement.innerText = "Нет";

            platforms = [
                { x: 0, y: 520, width: 700, height: 80 },
                { x: 800, y: 440, width: 220, height: 30 },
                { x: 1100, y: 360, width: 180, height: 30 },
                { x: 1380, y: 450, width: 250, height: 30 },
                { x: 1700, y: 330, width: 200, height: 30 },
                { x: 2000, y: 460, width: 300, height: 30 },
                { x: 2400, y: 380, width: 220, height: 30 },
                { x: 2750, y: 300, width: 200, height: 30 },
                { x: 3050, y: 440, width: 350, height: 30 },
                { x: 3500, y: 360, width: 250, height: 30 },
                { x: 3850, y: 470, width: 300, height: 30 },
                { x: 4250, y: 380, width: 750, height: 220 }
            ];

            spikes = [
                { x: 450, y: 490, width: 40, height: 30 },
                { x: 900, y: 410, width: 40, height: 30 },
                { x: 1450, y: 420, width: 40, height: 30 },
                { x: 2100, y: 430, width: 50, height: 30 },
                { x: 2850, y: 270, width: 40, height: 30 },
                { x: 3200, y: 410, width: 40, height: 30 },
                { x: 4000, y: 440, width: 50, height: 30 }
            ];

            enemies = [
                { x: 300, y: 480, width: 35, height: 40, minX: 150, maxX: 600, speed: 2 },
                { x: 1750, y: 290, width: 35, height: 40, minX: 1710, maxX: 1880, speed: 2.5 },
                { x: 3100, y: 400, width: 35, height: 40, minX: 3080, maxX: 3350, speed: 3 },
                { x: 3900, y: 430, width: 35, height: 40, minX: 3870, maxX: 4120, speed: 2.5 }
            ];

            coins = [];
            for (let i = 0; i < 45; i++) {
                coins.push({
                    x: 200 + i * 100 + (i % 3) * 20,
                    y: 220 + (i % 5) * 45,
                    radius: 10,
                    collected: false
                });
            }

            powerUps = [
                { x: 880, y: 390, type: 'speed', width: 25, height: 25, collected: false },
                { x: 1760, y: 280, type: 'shield', width: 25, height: 25, collected: false },
                { x: 2780, y: 240, type: 'speed', width: 25, height: 25, collected: false },
                { x: 3600, y: 310, type: 'shield', width: 25, height: 25, collected: false }
            ];
        }

        const keys = { right: false, left: false, up: false };

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
        });

        const bindTouch = (id, keyName) => {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); keys[keyName] = true; };
            const end = (e) => { e.preventDefault(); keys[keyName] = false; };
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
        };

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'up');

        function startGame() {
            initLevel();
            menuScreen.style.display = 'none';
            gameActive = true;

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                timerElement.innerText = timeLeft;

                if (speedBuffTimer > 0) speedBuffTimer--;
                if (invulnerableTimer > 0) invulnerableTimer--;

                let buffsText = [];
                if (speedBuffTimer > 0) buffsText.push(`⚡ Ускорение (${speedBuffTimer}с)`);
                if (invulnerableTimer > 0) buffsText.push(`🛡️ Щит (${invulnerableTimer}с)`);
                buffStatusElement.innerText = buffsText.length > 0 ? buffsText.join(' | ') : "Нет";

                if (timeLeft <= 0) {
                    gameOver("Время вышло! Уровень нужно проходить за 144 секунды!");
                }
            }, 1000);
        }

        function hitHazard() {
            if (invulnerableTimer > 0) return;

            if (growth > 1) {
                growth--;
                updatePlayerSize();
                invulnerableTimer = 2;
            } else {
                gameOver("Вы наступили на шип или врага малым размером!");
            }
        }

        function gameOver(message) {
            gameActive = false;
            clearInterval(timerInterval);
            menuTitle.innerText = "ПОРАЖЕНИЕ";
            document.getElementById('companyName').innerText = "";
            menuSubtitle.innerText = message;
            actionBtn.innerText = "НАЧАТЬ ЗАНОВО";
            menuScreen.style.display = 'flex';
        }

        function gameWin() {
            gameActive = false;
            clearInterval(timerInterval);
            menuTitle.innerText = "ПОБЕДА УСПЕШНА!";
            document.getElementById('companyName').innerText = "ОТ КОМПАНИИ AKERENT";
            menuSubtitle.innerText = `Вы залезли в трубу и прошли за ${144 - timeLeft} сек! Рост: ${growth}x. Монеты: ${score}.`;
            actionBtn.innerText = "ИГРАТЬ ЕЩЕ РАЗ";
            menuScreen.style.display = 'flex';
        }

        function rectIntersect(r1, r2) {
            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        function update() {
            if (!gameActive) return;

            let currentSpeed = speedBuffTimer > 0 ? BOOSTED_SPEED : NORMAL_SPEED;

            player.vx = 0;
            if (keys.right) player.vx = currentSpeed;
            if (keys.left) player.vx = -currentSpeed;

            if (keys.up && player.onGround) {
                player.vy = -JUMP_FORCE;
                player.onGround = false;
            }

            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;

            if (player.x < 0) player.x = 0;

            player.onGround = false;
            platforms.forEach(p => {
                if (rectIntersect(player, p)) {
                    if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.onGround = true;
                    } else if (player.vy < 0 && player.y - player.vy >= p.y + p.height) {
                        player.y = p.y + p.height;
                        player.vy = 0;
                    } else if (player.vx > 0) {
                        player.x = p.x - player.width;
                    } else if (player.vx < 0) {
                        player.x = p.x + p.width;
                    }
                }
            });

            if (player.y > canvas.height) {
                gameOver("Вы упали в пропасть!");
            }

            enemies.forEach(e => {
                e.x += e.speed;
                if (e.x > e.maxX || e.x < e.minX) e.speed *= -1;
                if (rectIntersect(player, e)) {
                    hitHazard();
                }
            });

            spikes.forEach(s => {
                if (rectIntersect(player, s)) {
                    hitHazard();
                }
            });

            coins.forEach(c => {
                if (!c.collected) {
                    let distX = (player.x + player.width/2) - c.x;
                    let distY = (player.y + player.height/2) - c.y;
                    let distance = Math.sqrt(distX * distX + distY * distY);
                    if (distance < c.radius + player.width/2) {
                        c.collected = true;
                        score += 100;
                        scoreElement.innerText = score;

                        if (score % 400 === 0 && growth < 3) {
                            growth++;
                            updatePlayerSize();
                        }
                    }
                }
            });

            powerUps.forEach(p => {
                if (!p.collected && rectIntersect(player, p)) {
                    p.collected = true;
                    if (p.type === 'speed') {
                        speedBuffTimer = 10;
                    } else if (p.type === 'shield') {
                        invulnerableTimer = 10;
                    }
                }
            });

            if (rectIntersect(player, finishPipe)) {
                gameWin();
            }

            cameraX = player.x - 250;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > LEVEL_WIDTH - canvas.width) cameraX = LEVEL_WIDTH - canvas.width;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Труба (Финиш)
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(finishPipe.x, finishPipe.y, finishPipe.width, finishPipe.height);
            ctx.fillRect(finishPipe.x - 8, finishPipe.y, finishPipe.width + 16, 35);
            ctx.fillStyle = '#fff';
            ctx.font = "bold 15px Arial";
            ctx.fillText("ТРУБА", finishPipe.x + 6, finishPipe.y - 10);

            // Платформы
            platforms.forEach(p => {
                ctx.fillStyle = '#16213e';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.width, p.height);
            });

            // Шипы
            spikes.forEach(s => {
                ctx.fillStyle = '#e94560';
                ctx.beginPath();
                ctx.moveTo(s.x, s.y + s.height);
                ctx.lineTo(s.x + s.width / 2, s.y);
                ctx.lineTo(s.x + s.width, s.y + s.height);
                ctx.fill();
                ctx.closePath();
            });

            // Враги
            enemies.forEach(e => {
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(e.x, e.y, e.width, e.height);
            });

            // Монеты
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fill();
                    ctx.closePath();
                }
            });

            // Усиления
            powerUps.forEach(p => {
                if (!p.collected) {
                    ctx.fillStyle = p.type === 'speed' ? '#3498db' : '#2ecc71';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = "14px Arial";
                    ctx.fillText(p.type === 'speed' ? "⚡" : "🛡️", p.x + 4, p.y + 18);
                }
            });

            // Подсветка при бессмертии / щите
            if (invulnerableTimer > 0) {
                ctx.strokeStyle = '#2ecc71';
                ctx.lineWidth = 4;
                ctx.strokeRect(player.x - 3, player.y - 3, player.width + 6, player.height + 6);
            }

            ctx.fillStyle = growth === 3 ? '#e94560' : (growth === 2 ? '#f1c40f' : '#4ecca3');
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
